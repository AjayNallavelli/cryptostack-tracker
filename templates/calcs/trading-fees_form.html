<div class="calc">
<form data-calc="trading-fees">
  <fieldset>
    <legend>Trading fee calculator</legend>
    <p class="small muted">Pick a published preset or type your own rates. Use the same unit for trade size and fixed fees (for example USDT, or SOL).</p>
    <div class="calc-field calc-full">
      <label for="tf-mode">Venue type</label>
      <select id="tf-mode" name="mode">
        <option value="cex">Centralized exchange (maker / taker)</option>
        <option value="dex">DEX, terminal or launchpad (percentage + priority fees)</option>
      </select>
    </div>
    <p class="small muted">Published presets (regular-user or documented default rates). Click one, then change any field.</p>
    <div class="preset-row" data-mode="cex">
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.1","taker":"0.1","buy_side":"taker","sell_side":"taker"}'>Binance spot (regular)</button>
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.075","taker":"0.075","buy_side":"taker","sell_side":"taker"}'>Binance spot with BNB 25% off</button>
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.02","taker":"0.05","buy_side":"taker","sell_side":"taker"}'>Binance USDⓈ-M perps (regular)</button>
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.1","taker":"0.1","buy_side":"taker","sell_side":"taker"}'>Bybit spot crypto-crypto (VIP 0)</button>
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.02","taker":"0.055","buy_side":"taker","sell_side":"taker"}'>Bybit perps (VIP 0)</button>
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.08","taker":"0.1","buy_side":"taker","sell_side":"taker"}'>OKX spot (regular)</button>
      <button type="button" class="preset" data-preset='{"mode":"cex","maker":"0.02","taker":"0.05","buy_side":"taker","sell_side":"taker"}'>OKX futures (FAQ example rate)</button>
    </div>
    <div class="preset-row" data-mode="dex" hidden>
      <button type="button" class="preset" data-preset='{"mode":"dex","venue_fee":"0","protocol_fee":"0","priority":"0","tip":"0"}'>Jupiter Manual (0% commission)</button>
      <button type="button" class="preset" data-preset='{"mode":"dex","venue_fee":"0.5","protocol_fee":"0","priority":"0","tip":"0"}'>Jupiter Ultra, token under 24h</button>
      <button type="button" class="preset" data-preset='{"mode":"dex","venue_fee":"0.85","protocol_fee":"0","priority":"0","tip":"0"}'>Phantom swap (0.85%)</button>
      <button type="button" class="preset" data-preset='{"mode":"dex","venue_fee":"1","protocol_fee":"0","priority":"0.001","tip":"0.001"}'>Axiom default (1% + 0.001 + 0.001)</button>
      <button type="button" class="preset" data-preset='{"mode":"dex","venue_fee":"1","protocol_fee":"0","priority":"0","tip":"0"}'>GMGN / Photon / Trojan / BONKbot (1%)</button>
      <button type="button" class="preset" data-preset='{"mode":"dex","venue_fee":"0.45","protocol_fee":"1.25","priority":"0","tip":"0"}'>pump.fun app + curve</button>
    </div>
    <div class="calc-grid">
      <div class="calc-field">
        <label for="tf-notional">Trade size (one side)</label>
        <input id="tf-notional" name="notional" type="number" inputmode="decimal" min="0" step="any" value="1000" required>
      </div>
      <div class="calc-field">
        <label for="tf-trips">Round trips</label>
        <input id="tf-trips" name="trips" type="number" inputmode="decimal" min="1" step="1" value="1">
      </div>
      <div class="calc-field" data-mode="cex">
        <label for="tf-maker">Maker fee (%)</label>
        <input id="tf-maker" name="maker" type="number" inputmode="decimal" min="0" step="any" value="0.1">
      </div>
      <div class="calc-field" data-mode="cex">
        <label for="tf-taker">Taker fee (%)</label>
        <input id="tf-taker" name="taker" type="number" inputmode="decimal" min="0" step="any" value="0.1">
      </div>
      <div class="calc-field" data-mode="cex">
        <label for="tf-buy">Buy is a</label>
        <select id="tf-buy" name="buy_side"><option value="taker" selected>Taker</option><option value="maker">Maker</option></select>
      </div>
      <div class="calc-field" data-mode="cex">
        <label for="tf-sell">Sell is a</label>
        <select id="tf-sell" name="sell_side"><option value="taker" selected>Taker</option><option value="maker">Maker</option></select>
      </div>
      <div class="calc-field" data-mode="dex" hidden>
        <label for="tf-venue">Venue / terminal fee (%)</label>
        <input id="tf-venue" name="venue_fee" type="number" inputmode="decimal" min="0" step="any" value="1" disabled>
      </div>
      <div class="calc-field" data-mode="dex" hidden>
        <label for="tf-proto">Protocol / curve fee (%)</label>
        <input id="tf-proto" name="protocol_fee" type="number" inputmode="decimal" min="0" step="any" value="0" disabled>
      </div>
      <div class="calc-field" data-mode="dex" hidden>
        <label for="tf-prio">Priority fee (fixed, each way)</label>
        <input id="tf-prio" name="priority" type="number" inputmode="decimal" min="0" step="any" value="0" disabled>
      </div>
      <div class="calc-field" data-mode="dex" hidden>
        <label for="tf-tip">Tip / bribe (fixed, each way)</label>
        <input id="tf-tip" name="tip" type="number" inputmode="decimal" min="0" step="any" value="0" disabled>
      </div>
    </div>
    <div class="calc-actions"><button type="submit" class="btn">Calculate</button></div>
    <p class="calc-error" hidden></p>
    <div class="calc-result" hidden></div>
  </fieldset>
</form>
</div>
